<!-- INITIALISATION -->
<!DOCTYPE html> 
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> ECG </title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- STYLING TIME -->
<style>
	:root {
		--bg: #070b0e;
		--bg-2: #0c1318;
		--ink: #e7f5ef;
		--ink-dim: #7d958c;
		--red: #ff4d5e;
		--trace: #00f5a0;
		--trace-glow: rgba(0, 245, 160, 0.3);
		--mono: 'IBM Plex Mono', monospace;
		--sans: 'IBM Plex Sans', sans-serif;
		--line: rgba(0, 245, 160, 0.55);
		--grid-minor: rgba(0, 255, 153, 0.06);
		--grid-major: rgba(0, 255, 153, 0.09);

	}

	* { margin: 0; padding: 0; box-sizing: border-box;}

	body {
		font-family: var(--sans);
		color: var(--ink);
		background: var(--bg);
		background-image:
			linear-gradient(var(--grid-minor) 1px, transparent 1px),
			linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px),
			linear-gradient(var(--grid-major) 1px, transparent 1px),
			linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);
		background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
		min-height: 100vh;
	}

	.screen { display: none; }
	.screen.active {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
	padding: 48px 24px;
	}

	#screen-knowledge, #screen-quiz { width: 100% }
	#quizbody, #quizresult, #knowledge-video { width: 100%; max-width: 640px; margin: 0 auto; }


	h1 {
		font-family: var(--mono);
		font-weight: 700;
		letter-spacing: -0.01em;
		margin-bottom: 24px;
	}
	#screen-home h1 { color: var(--trace); font-size: 2.6rem; }

	#prompt {
		font-size: 1.15rem;
		font-weight: 500;
		margin: 18px 0;
		line-height: 1.4; 
	}
	#feedback, #score {
		font-family: var(--mono);
		font-size: 13px;
		letter-spacing: 0.08em;
		color: var(--ink-dim);
		margin-top: 12px;
	}
 	
	#progress {
	width: 100%;
	height: 4px;
	background: var(--line);
	margin-bottom: 24px;
		border-radius: 4px;
overflow:hidden;
}	
	
	#progressbar {
	display: block;
width: 0%;
	height: 100%;
	background: var(--trace);
	box-shadow: 0 0 10px var(--trace-glow);
		transition: width 0.35s ease;
}	


	button {
		font-family: var(--mono);
		font-size: 15px;
		font-weight: 600;
		letter-spacing: 0.03em;
		color: var(--trace);
		background: transparent;
		border: 1.5px solid var(--trace);
		border-radius: 4px;
		padding: 14px 28px;
		margin: 6px;
		cursor: pointer;
		transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
	}
	button:hover {
		transform: translateY(-2px); 
box-shadow: 0 8px 24px -8px var(--trace-glow); 
}


	#screen-home button:first-of-type {
		background: var(--trace);
		color: #04130d;
		box-shadow: 0 0 24px -6px var(--trace-glow);
	}

	#options { display: flex; flex-direction: column; gap:10px; }
	#options button {
		width: 100%;
		text-align: left;
		font-family: var(--sans);
		font-weight: 400;
		color: var(--ink);
		background: var(--bg-2);
		border: 1px solid var(--line);
		margin:0;
		padding: 16px 18px;
	}

	#options 	button:hover {
		border-color: var(--trace); 
transform: translateX(3px); 
}
#options.locked button { cursor: default; transform: none; }

#options button.correct {
	border-color: var(--trace);
	background: rgba(0, 245, 160, 0.08);
	color: var(--trace);
}

#options button.wrong {
	border-color: var(--red);
	background: rgba(255, 77, 94, 0.08);
	color: var(--red);
}
#ecg { margin: 12px 0; }
#ecg img {
	display: block;
	width: 100%;
	height: auto;
	background: #fff;
	border: 1px solid var(--line);
	border-radius: 4px;
	}

	#explanation { display: none; }
	#explanation.show {
		display: block;
		margin-top: 16px;
		padding: 16px 18px;
		border-left: 2px solid var(--trace);
		background: var(--bg-2);
		border-radius: 0 4px 4px 0;
		line-height: 1.55;
		font-weight: 300;
	}
	#explanation p { margin: 0; }

	.video-wrap {
		position: relative;
		width: 100%;
		aspect-ratio: 16 / 9;
		margin-top: 12px;
	}
	
	.video-wrap iframe {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
		border-radius: 4px;
	}

.video-wrap video { width=100%; height:100%; border-radius: 4px;}

</style>


</head>
<body>

<!-- HOME SECTION -->
<section id="screen-home" class="screen active">
	<h1> ECG Quiz </h1>
	<button onclick="show('quiz'); start()"> Play </button>
	<button onclick="show('knowledge')"> Background Knowledge </button>
</section>


<!-- BACKGROUND KNOWLEDGE SECTION -->
<section id="screen-knowledge" class="screen">
	<h1> Background Knowledge </h1>
	<div id="knowledge-video"></div>
	<button onclick="show('home')"> Back </button>
</section>


<!-- QUIZ SECTION -->
<section id="screen-quiz" class="screen">
	<h1> Quiz </h1>
	<div id="quizbody">
		<div id="progress"><span id="progressbar"></span></div>
<div id="ecg"> </div>
<p id="prompt"></p>
<div id="options"></div>
<p id="feedback"></p>
<div id="explanation"></div>
<p id="score"></p>	
<button id="nextbtn" onclick="next()" style="display:none">Next</button>
	</div>
<div id="quizresult" style="display:none">
	<p id="finalscore"></p>
	<button onclick="start()"> Retry </button>
</div>
	<button onclick="show('home')"> Back </button>
</section>



<!-- SCRIPT SECTION -->
<script>
	function show(id) {
		document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
		document.getElementById('screen-' + id).classList.add('active');
		window.scrollTo(0, 0);
	}

	function videoEmbed(url) {
		if (!url) return '';
		if (/\.(mp4)$/i.test(url)) {
			return '<div class="video-wrap"><video controls src="' + url + '"></video></div>';
		}
		return '<div class="video-wrap"><iframe src="' + url + '" allowfullscreen></iframe></div>';
	}

	const knowledgeVideo = "";

	function renderknowledge() {
		document.getElementById('knowledge-video').innerHTML = knowledgeVideo ? videoEmbed(knowledgeVideo) : '<p> [pretend video is here] </p>';
	}
	



	const questions = [
		{ prompt: "Which complication corresponds with this ECG?", img: "img/afib.jpg", options: ["Atrial fibrillation", "Ventricular fibrillation", "First-degree AV block", "Atrial flutter"], answer: 0,
explanation: "Inconsistent timing of beats (specifically QRS complexes) and lack of clear, organised P waves is consistent with atrial fibrillation.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/vfib.jpg", options: ["Ventricular tachycardia", "Sinus bradycardia", "Atrial flutter", "Ventricular fibrillation"], answer: 3,
explanation: "Absence of any recognisable QRS complexes and presence of a rapidly oscillating waveform is consistent with ventricular fibrillation.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/aflutter.jpg", options: ["Third-degree heart block", "First-degree AV block", "Atrial flutter", "Premature atrial contraction"], answer: 2,
explanation: "Regularly spaced beats with a steady repeating sawtooth baseline wave is consistent with atrial flutter. ", video: "" }, 
{ prompt: "Which complication corresponds with this ECG?", img: "img/third-degree-block.jpg", options: ["First-degree AV block", "Ventricular tachycardia", "Sinus bradycardia", "Third-degree heart block"], answer: 3,
explanation: "P waves and QRS complexes each holding their own rhythm without being fixed to each other is consistent with third-degree heart block. Note the QRS complex appears upside down due to the lead from which this ECG was recorded.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/first-degree-block.jpg", options: ["Premature atrial contraction", "Sinus tachycardia", "First-degree AV block", "Atrial flutter"], answer: 2,
explanation: "A long PR interval (gap between P wave and QRS complex) with every P wave still conducting is consistent with first-degree AV block.", video: "" }
];

	let idx = 0, score = 0, answered = false;
	
	function start() {
		idx =0; score = 0;
		document.getElementById('quizbody').style.display = 'block';
		document.getElementById('quizresult').style.display = 'none';
		getquestion();
	}

	function getquestion() {
		answered = false;
		const q = questions[idx];
		document.getElementById('progressbar').style.width = (idx / questions.length * 100) + '%';
		document.getElementById('ecg').innerHTML = '<img src="' + q.img + '" alt="ECG trace">';
		document.getElementById('prompt').textContent = q.prompt;
		document.getElementById('feedback').textContent = '';
		const exp = document.getElementById('explanation');
		exp.innerHTML = '';
		exp.classList.remove('show');
		document.getElementById('score').textContent = 'Score: ' + score;
		document.getElementById('nextbtn').style.display = 'none';
		const opts = document.getElementById('options');
		opts.innerHTML = '';
		opts.classList.remove('locked');
		q.options.forEach((text, i) => {
			const b = document.createElement('button')
			b.textContent = text;
			b.onclick = () => choose(i);
			opts.appendChild(b);
		});
	}

	function choose(i) {
		if (answered) return;
		answered = true;
		const q = questions[idx];

		const opts = document.getElementById('options');
		const buttons = opts.querySelectorAll('button');
		opts.classList.add('locked');
		buttons.forEach(b => b.disabled = true);
		buttons[q.answer].classList.add('correct');
		if (i === q.answer) {
			score++;
			document.getElementById('feedback').textContent = 'Correct';
		} else {
			buttons[i].classList.add('wrong');
			document.getElementById('feedback').textContent = 'Wrong';
		}
document.getElementById('score').textContent = 'Score: ' + score;
		const exp = document.getElementById('explanation');
		exp.innerHTML = '<p>' + q.explanation + '</p>' + videoEmbed(q.video);
		exp.classList.add('show');

		document.getElementById('nextbtn').style.display = 'inline';
	}



	function next() {
		if (idx < questions.length - 1) { idx ++; getquestion(); }
		else { finish(); }
	}

	function finish() {
		document.getElementById('progressbar').style.width =  '100%';
		document.getElementById('quizbody').style.display = 'none';
		document.getElementById('quizresult').style.display = 'block';
		document.getElementById('finalscore').textContent = 'Final score: ' + score + ' out of ' + questions.length;
	}

	renderknowledge();

</script>
</body>
</html>
