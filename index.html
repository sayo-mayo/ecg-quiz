<!-- INITIALISATION -->
<!DOCTYPE html> 
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Reading The ECG </title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- STYLING TIME -->
<style>
	:root {
		--bg: #070b0e;
		--bg-2: #0c1318;
		--ink: #e7f5ef;
		--ink-dim: #7d958c;
		--red: #ff4d5e;
		--trace: #00f5a0;
		--trace-glow: rgba(0, 245, 160, 0.3);
		--mono: 'IBM Plex Mono', monospace;
		--sans: 'IBM Plex Sans', sans-serif;
		--line: rgba(0, 245, 160, 0.55);
		--grid-minor: rgba(0, 255, 153, 0.06);
		--grid-major: rgba(0, 255, 153, 0.09);

	}

	* { margin: 0; padding: 0; box-sizing: border-box;}

	body {
		font-family: var(--sans);
		color: var(--ink);
		background: var(--bg);
		background-image:
			linear-gradient(var(--grid-minor) 1px, transparent 1px),
			linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px),
			linear-gradient(var(--grid-major) 1px, transparent 1px),
			linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);
		background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
		min-height: 100vh;
	}

	.screen { display: none; }
	.screen.active {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	min-height: 100vh;
	padding: 48px 24px;
	}

	#screen-knowledge, #screen-quiz { width: 100% }
	#quizbody, #quizresult, #knowledge-body { width: 100%; max-width: 640px; margin: 0 auto; }


	
	.qbar {
	display:flex;
	justify-content: space-between;
	align-items: center;
	width: 100%;
	margin-bottom: 20px;
	}
	.qbar > * { margin: 0;}

	h1 {
		font-family: var(--mono);
		font-weight: 700;
		letter-spacing: -0.01em;
		margin-bottom: 24px;
	}
	

	#screen-knowledge h1 {
		font-size: clamp(2rem, 6vw, 3rem);
		color: var(--ink);
		text-align: left;
		margin-bottom: 24px;
	}
	

	.monitor-label {
		font-family: var(--mono);
		font-size: 12px;
		letter-spacing: 0.32em;
		text-transform: uppercase;
		color: var(--trace);
		margin-bottom: 28px;
	}

	#screen-home .blip {
		display: inline-block;
		width: 7px;
		height: 7px;
		border-radius: 50%;
		background: var(--trace);
		box-shadow: 0 0 10px var(--trace-glow);
		margin-right: 10px;
		animation: pulse 1.1s infinite;
	}

	@keyframes pulse {
		0%, 100% { opacity: 1; transform: scale(1); }
		50% { opacity: 0.35; transform: scale(0.7); }
	}

	#screen-home .title {
		font-size: clamp(2.4rem, 8vw, 5.5rem);
		line-height: 0.96;
		letter-spacing: -0.02em;
		text-align: center;
		margin-bottom: 0;
	}
#screen-home .title .accent { color: var(--trace) }
#screen-home .subtitle {
	margin-top: 22px;
	max-width: 540px;
	text-align: center;
	color: var(--ink-dim);
	font-size: 1.05rem;
	font-weight: 300;
	line-height: 1.55;
}
	.home-actions{
		display: flex;
		gap: 18px;
		margin-top:36px;
		flex-wrap: wrap;
		justify-content: center;
	}



	#prompt {
		font-size: 1.15rem;
		font-weight: 500;
		margin: 18px 0;
		line-height: 1.4; 
	}
	#score, #qcount {
		font-family: var(--mono);
		font-size: 13px;
		letter-spacing: 0.08em;
		color: var(--ink-dim);
		margin-top: 12px;
	}
 	
	#progress {
	width: 100%;
	height: 4px;
	background: var(--line);
	margin-bottom: 24px;
		border-radius: 4px;
overflow:hidden;
}	
	
	#progressbar {
	display: block;
width: 0%;
	height: 100%;
	background: var(--trace);
	box-shadow: 0 0 10px var(--trace-glow);
		transition: width 0.35s ease;
}	


	button {
		font-family: var(--mono);
		font-size: 15px;
		font-weight: 600;
		letter-spacing: 0.03em;
		color: var(--trace);
		background: transparent;
		border: 1.5px solid var(--trace);
		border-radius: 4px;
		padding: 14px 28px;
		margin: 6px;
		cursor: pointer;
		transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
	}
	button:hover {
		transform: translateY(-2px); 
box-shadow: 0 8px 24px -8px var(--trace-glow); 
}



	.btn {
		display: inline-flex;
		align-items: center;
		gap: 12px;
		padding: 18px 38px;
		margin: 0;
	}

	.btn .ico { width: 18px; height: 18px; flex: 0 0 auto; }

	.btn.primary {
		background: var(--trace);
		color: #04130d;
		box-shadow: 0 0 24px -6px var(--trace-glow);
	}

	.btn.ghost {
		border-color: var(--line);
		color: var(--ink);
	}

	.btn.ghost:hover { border-color: var(--trace); color: var(--trace); }


#nextbtn {
	background: var(--trace);
	color: #04130d;
	margin: 18px 0 0 auto;
	display: block;
	width: fit-content;
	box-shadow: 0 0 20px -8px var(--trace-glow);
}

.back {
	border: none;
background: none;
	color: var(--ink-dim);
font-size: 13px;
	margin-top: 28px;
	letter-spacing: 0.08em;
	padding: 8px 0;
}

.back:hover {
	color: var(--trace);
	transform: none;
	box-shadow: none;
}


	#options { display: flex; flex-direction: column; gap:10px; }
	#options button {
		width: 100%;
		text-align: left;
		font-family: var(--sans);
		font-weight: 400;
		color: var(--ink);
		background: var(--bg-2);
		border: 1px solid var(--line);
		margin:0;
		padding: 16px 18px;
	}

	#options 	button:hover {
		border-color: var(--trace); 
transform: translateX(3px); 
}
#options.locked button { cursor: default; transform: none; }

#options button.correct {
	border-color: var(--trace);
	background: rgba(0, 245, 160, 0.08);
	color: var(--trace);
}

#options button.wrong {
	border-color: var(--red);
	background: rgba(255, 77, 94, 0.08);
	color: var(--red);
}
#ecg { margin: 12px 0; }
#ecg img {
	display: block;
	width: 100%;
	height: auto;
	background: #fff;
	border: 1px solid var(--line);
	border-radius: 4px;
	}

	#explanation { display: none; }
	#explanation.show {
		display: block;
		margin-top: 16px;
		padding: 16px 18px;
		border-left: 2px solid var(--trace);
		background: var(--bg-2);
		border-radius: 0 4px 4px 0;
		line-height: 1.55;
		font-weight: 300;
	}
	#explanation p { margin: 0; }

	.video-wrap {
		position: relative;
		width: 100%;
		aspect-ratio: 16 / 9;
		margin-top: 12px;
	}
	
	.video-wrap iframe {
		position: absolute;
		inset: 0;
		width: 100%;
		height: 100%;
		border: 0;
		border-radius: 4px;
	}

.video-wrap video { width:100%; height:100%; border-radius: 4px;}

	#quizresult { text-align: center; }
	#finalscore {
	font-family: var(--mono);
	font-size: clamp(3rem, 12vw, 6rem);
	font-weight: 700;
	color: var(--trace);
	line-height: 1;
	text-shadow: 0 0 30px var(--trace-glow);
	margin-bottom: 10px;
	}


</style>


</head>
<body>

<!-- HOME SECTION -->
<section id="screen-home" class="screen active">
	<div class="monitor-label"><span class="blip"></span>PHYS20008 &middot; Cardiovascular Physiology</div>
	<h1 class="title"> READING THE <br><span class="accent">ELECTROCARDIOGRAM</span></h1>
	<p class="subtitle"> Diagnose the condition that would cause the aberrant ECG to be formed. </p>
	<div class="home-actions">
		<button class="btn primary" onclick="show('quiz'); start()">
			<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
		PLAY
		</button>
		<button class="btn ghost" onclick="show('knowledge')">
			<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
		BACKGROUND KNOWLEDGE
		</button>
	</div>
</section>


<!-- BACKGROUND KNOWLEDGE SECTION -->
<section id="screen-knowledge" class="screen">
	<div id="knowledge-body">
	<div class="qbar">
		<button class="back" onclick="show('home')"> &larr; HOME </button>
		<span class="monitor-label">BACKGROUND KNOWLEDGE</span>
	</div>
	<h1> How a normal ECG is generated</h1>
	<div id="knowledge-video"></div>
	</div>
</section>


<!-- QUIZ SECTION -->
<section id="screen-quiz" class="screen">
	<div id="quizbody">
		<div class="qbar">
<button class="back" onclick="show('home')"> &larr; HOME </button>
</div>
	<div id="progress"><span id="progressbar"></span></div>
		<div class="qbar">
			<span id="qcount"></span>
			<span id="score"></span>
		</div>
<div id="ecg"> </div>
<p id="prompt"></p>
<div id="options"></div>
<div id="explanation"></div>
<button id="nextbtn" onclick="next()" style="display:none">NEXT</button>	
	</div>
<div id="quizresult" style="display:none">
	<p id="finalscore"></p>
	<div class="home-actions">
		<button class="btn primary" onclick="start()">RETRY</button>
		<button class="btn ghost" onclick="show('home')">HOME</button>
</div>
	</div>
</section>



<!-- SCRIPT SECTION -->
<script>
	function show(id) {
		document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
		document.getElementById('screen-' + id).classList.add('active');
		window.scrollTo(0, 0);
	}

	function videoEmbed(url) {
		if (!url) return '';
		if (/\.(mp4)$/i.test(url)) {
			return '<div class="video-wrap"><video controls src="' + url + '"></video></div>';
		}
		return '<div class="video-wrap"><iframe src="' + url + '" allowfullscreen></iframe></div>';
	}

	const knowledgeVideo = "";

	function renderknowledge() {
		document.getElementById('knowledge-video').innerHTML = knowledgeVideo ? videoEmbed(knowledgeVideo) : '<p> [pretend video is here] </p>';
	}
	



	const questions = [
		{ prompt: "Which complication corresponds with this ECG?", img: "img/afib.jpg", options: ["Atrial fibrillation", "Ventricular fibrillation", "First-degree AV block", "Atrial flutter"], answer: 0,
explanation: "Inconsistent timing of beats (specifically QRS complexes) and lack of clear, organised P waves is consistent with atrial fibrillation.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/vfib.jpg", options: ["Ventricular tachycardia", "Sinus bradycardia", "Atrial flutter", "Ventricular fibrillation"], answer: 3,
explanation: "Absence of any recognisable QRS complexes and presence of a rapidly oscillating waveform is consistent with ventricular fibrillation.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/aflutter.jpg", options: ["Third-degree heart block", "First-degree AV block", "Atrial flutter", "Premature atrial contraction"], answer: 2,
explanation: "Regularly spaced beats with a steady repeating sawtooth baseline wave is consistent with atrial flutter. ", video: "" }, 
{ prompt: "Which complication corresponds with this ECG?", img: "img/third-degree-block.jpg", options: ["First-degree AV block", "Ventricular tachycardia", "Sinus bradycardia", "Third-degree heart block"], answer: 3,
explanation: "P waves and QRS complexes each holding their own rhythm without being fixed to each other is consistent with third-degree heart block. Note the QRS complex appears upside down due to the lead from which this ECG was recorded.", video: "" },
{ prompt: "Which complication corresponds with this ECG?", img: "img/first-degree-block.jpg", options: ["Premature atrial contraction", "Sinus tachycardia", "First-degree AV block", "Atrial flutter"], answer: 2,
explanation: "A long PR interval (gap between P wave and QRS complex) with every P wave still conducting is consistent with first-degree AV block.", video: "" }
];

	let idx = 0, score = 0, answered = false;
	
	function start() {
		idx =0; score = 0;
		document.getElementById('quizbody').style.display = 'block';
		document.getElementById('quizresult').style.display = 'none';
		getquestion();
	}

	function getquestion() {
		answered = false;
		const q = questions[idx];
		document.getElementById('progressbar').style.width = (idx / questions.length * 100) + '%';
		document.getElementById('qcount').textContent = 'ECG ' + (idx + 1) + ' / ' + questions.length;
document.getElementById('score').textContent = 'SCORE ' + score;
		document.getElementById('ecg').innerHTML = '<img src="' + q.img + '" alt="ECG trace">';
		document.getElementById('prompt').textContent = q.prompt;
		const exp = document.getElementById('explanation');
		exp.innerHTML = '';
		exp.classList.remove('show');
		document.getElementById('nextbtn').style.display = 'none';
		const opts = document.getElementById('options');
		opts.innerHTML = '';
		opts.classList.remove('locked');
		q.options.forEach((text, i) => {
			const b = document.createElement('button')
			b.textContent = text;
			b.onclick = () => choose(i);
			opts.appendChild(b);
		});
	}

	function choose(i) {
		if (answered) return;
		answered = true;
		const q = questions[idx];

		const opts = document.getElementById('options');
		const buttons = opts.querySelectorAll('button');
		opts.classList.add('locked');
		buttons.forEach(b => b.disabled = true);
		buttons[q.answer].classList.add('correct');
		if (i === q.answer) {
			score++;
		} else {
			buttons[i].classList.add('wrong');
		}
document.getElementById('score').textContent = 'SCORE ' + score;
		const exp = document.getElementById('explanation');
		exp.innerHTML = '<p>' + q.explanation + '</p>' + videoEmbed(q.video);
		exp.classList.add('show');
		document.getElementById('nextbtn').style.display = 'block';
	}



	function next() {
		if (idx < questions.length - 1) { idx ++; getquestion(); }
		else { finish(); }
	}

	function finish() {
		document.getElementById('progressbar').style.width =  '100%';
		document.getElementById('quizbody').style.display = 'none';
		document.getElementById('quizresult').style.display = 'block';
		document.getElementById('finalscore').textContent = score + ' / ' + questions.length;
	}

	renderknowledge();

</script>
</body>
</html>
